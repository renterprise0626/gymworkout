<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>筋トレ記録</title>
<style>
:root {
  --bg: #f4f6fb;
  --card: #ffffff;
  --text: #1a1d29;
  --text-sub: #6b7280;
  --text-mute: #9ca3af;
  --primary: #6366f1;
  --primary-light: #eef0ff;
  --success: #10b981;
  --success-light: #d1fae5;
  --border: #e5e7eb;
  --warmup: #fef3c7;
  --warmup-text: #92400e;
  --shadow: 0 1px 3px rgba(0,0,0,0.04), 0 1px 2px rgba(0,0,0,0.06);
  --shadow-md: 0 4px 12px rgba(0,0,0,0.08);
  --radius: 14px;
  --radius-sm: 10px;
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

body {
  font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic UI", "Segoe UI", sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.5;
  padding-bottom: 80px;
  min-height: 100vh;
}

.container {
  max-width: 500px;
  margin: 0 auto;
  padding: 20px 16px;
}

/* ===== Header ===== */
.header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  margin-bottom: 18px;
}

.header h1 {
  font-size: 24px;
  font-weight: 700;
  letter-spacing: -0.02em;
}

.header .date {
  font-size: 13px;
  color: var(--text-sub);
  margin-top: 4px;
}

.header-btn {
  background: var(--card);
  border: 1px solid var(--border);
  padding: 8px 14px;
  border-radius: 999px;
  font-size: 13px;
  font-weight: 500;
  color: var(--text);
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  transition: all 0.15s;
}
.header-btn:active { transform: scale(0.96); }

/* ===== Tab/badge ===== */
.tab-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: var(--primary-light);
  color: var(--primary);
  padding: 6px 12px;
  border-radius: 999px;
  font-size: 12px;
  font-weight: 600;
  margin-bottom: 16px;
}
.tab-badge::before {
  content: "";
  width: 6px;
  height: 6px;
  background: var(--primary);
  border-radius: 50%;
}

/* ===== Volume card ===== */
.volume-card {
  background: var(--card);
  border-radius: var(--radius);
  padding: 18px 20px;
  box-shadow: var(--shadow);
  margin-bottom: 18px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.volume-card .label { font-size: 12px; color: var(--text-sub); margin-bottom: 4px; }
.volume-card .value {
  font-size: 28px;
  font-weight: 700;
  letter-spacing: -0.02em;
}
.volume-card .value .unit { font-size: 14px; font-weight: 500; color: var(--text-sub); margin-left: 4px; }
.volume-card .compare { font-size: 12px; color: var(--text-mute); text-align: right; }
.volume-card .compare.positive { color: var(--success); font-weight: 600; }
.volume-card .compare.negative { color: #ef4444; font-weight: 600; }

/* ===== Exercise card ===== */
.exercise-card {
  background: var(--card);
  border-radius: var(--radius);
  padding: 18px;
  box-shadow: var(--shadow);
  margin-bottom: 16px;
}

.exercise-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  margin-bottom: 14px;
  gap: 12px;
}

.exercise-name {
  font-size: 17px;
  font-weight: 700;
  letter-spacing: -0.01em;
}

.exercise-header-right {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 4px;
}

.exercise-volume {
  font-size: 13px;
  font-weight: 600;
  color: var(--text);
}
.exercise-volume .unit { font-size: 10px; color: var(--text-sub); margin-left: 2px; font-weight: 500; }
.exercise-volume.zero { color: var(--text-mute); }

.exercise-compare {
  font-size: 10px;
  color: var(--text-mute);
}
.exercise-compare.positive { color: var(--success); font-weight: 600; }
.exercise-compare.negative { color: #ef4444; font-weight: 600; }

.step-badge {
  background: var(--primary-light);
  color: var(--primary);
  font-size: 10px;
  font-weight: 600;
  padding: 3px 8px;
  border-radius: 999px;
}

/* ===== Set row ===== */
.set-row {
  margin-bottom: 12px;
  padding: 12px;
  border-radius: var(--radius-sm);
  background: #fafbfc;
  transition: all 0.2s;
}
.set-row.warmup { background: var(--warmup); }
.set-row.warmup .set-label { color: var(--warmup-text); }
.set-row.completed { background: var(--success-light); }
.set-row.completed .set-label { color: var(--success); }

.set-label {
  font-size: 12px;
  font-weight: 600;
  color: var(--text-sub);
  margin-bottom: 8px;
  display: flex;
  align-items: center;
  gap: 6px;
}

.set-controls {
  display: grid;
  grid-template-columns: 1fr 1fr auto;
  gap: 8px;
  align-items: end;
}

.input-group { display: flex; flex-direction: column; gap: 4px; }
.input-group .input-label { font-size: 10px; color: var(--text-mute); padding-left: 4px; }

.stepper {
  display: flex;
  align-items: stretch;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 8px;
  overflow: hidden;
}
.stepper button {
  background: transparent;
  border: none;
  width: 30px;
  font-size: 16px;
  font-weight: 600;
  color: var(--text-sub);
  cursor: pointer;
  transition: background 0.1s;
}
.stepper button:active { background: var(--primary-light); }
.stepper input {
  flex: 1;
  border: none;
  text-align: center;
  font-size: 15px;
  font-weight: 600;
  background: transparent;
  width: 100%;
  min-width: 0;
  -moz-appearance: textfield;
  font-family: inherit;
  color: var(--text);
}
.stepper input::-webkit-outer-spin-button,
.stepper input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
.stepper input:focus { outline: none; }

.complete-btn {
  background: var(--card);
  border: 1px solid var(--border);
  padding: 0 14px;
  height: 38px;
  border-radius: 8px;
  font-size: 13px;
  font-weight: 600;
  color: var(--text-sub);
  cursor: pointer;
  transition: all 0.15s;
  white-space: nowrap;
  font-family: inherit;
}
.complete-btn:active { transform: scale(0.96); }
.set-row.completed .complete-btn {
  background: var(--success);
  color: white;
  border-color: var(--success);
}

.add-set-btn {
  width: 100%;
  background: transparent;
  border: none;
  padding: 10px;
  color: var(--primary);
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  margin-top: 4px;
  font-family: inherit;
}
.add-set-btn:active { background: var(--primary-light); border-radius: 8px; }

/* ===== Memo & condition ===== */
.bottom-card {
  background: var(--card);
  border-radius: var(--radius);
  padding: 18px;
  box-shadow: var(--shadow);
  margin-bottom: 16px;
}
.bottom-card h3 {
  font-size: 14px;
  font-weight: 600;
  margin-bottom: 12px;
}
.condition-row {
  display: flex;
  gap: 6px;
  justify-content: space-between;
  margin-bottom: 14px;
}
.condition-btn {
  flex: 1;
  padding: 10px 0;
  border: 1px solid var(--border);
  background: var(--card);
  border-radius: 8px;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  font-family: inherit;
  transition: all 0.15s;
}
.condition-btn.active {
  background: var(--primary);
  color: white;
  border-color: var(--primary);
}

textarea.memo {
  width: 100%;
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 10px 12px;
  font-size: 14px;
  font-family: inherit;
  resize: vertical;
  min-height: 60px;
  background: var(--card);
  color: var(--text);
}
textarea.memo:focus { outline: none; border-color: var(--primary); }

/* ===== Save bar ===== */
.save-bar {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: rgba(255,255,255,0.95);
  backdrop-filter: blur(10px);
  border-top: 1px solid var(--border);
  padding: 12px 16px;
  display: flex;
  gap: 8px;
  z-index: 100;
}
.save-bar .container { padding: 0; display: flex; gap: 8px; width: 100%; }
.save-btn {
  flex: 1;
  background: var(--primary);
  color: white;
  border: none;
  padding: 14px;
  border-radius: var(--radius-sm);
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  font-family: inherit;
  box-shadow: var(--shadow-md);
}
.save-btn:active { transform: scale(0.98); }
.save-btn.saved { background: var(--success); }

/* ===== History modal ===== */
.modal {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.4);
  z-index: 1000;
  overflow-y: auto;
}
.modal.open { display: block; }
.modal-content {
  background: var(--bg);
  max-width: 500px;
  margin: 0 auto;
  min-height: 100vh;
  padding: 20px 16px 100px;
}
.modal-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 18px;
}
.modal-header h2 { font-size: 22px; font-weight: 700; }
.close-btn {
  background: var(--card);
  border: 1px solid var(--border);
  width: 36px;
  height: 36px;
  border-radius: 50%;
  font-size: 18px;
  cursor: pointer;
  font-family: inherit;
}

.history-actions {
  display: flex;
  gap: 8px;
  margin-bottom: 16px;
}
.history-actions button {
  flex: 1;
  padding: 10px;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 8px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  font-family: inherit;
  color: var(--text);
}
.history-actions button.danger { color: #ef4444; }

.history-item {
  background: var(--card);
  border-radius: var(--radius);
  padding: 14px 16px;
  margin-bottom: 10px;
  box-shadow: var(--shadow);
}
.history-item .date { font-size: 14px; font-weight: 700; }
.history-item .total-row {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  margin-top: 4px;
  padding-bottom: 10px;
  border-bottom: 1px solid var(--border);
  margin-bottom: 10px;
}
.history-item .total-volume {
  font-size: 20px;
  font-weight: 700;
  color: var(--primary);
}
.history-item .total-volume .unit { font-size: 11px; color: var(--text-sub); margin-left: 2px; font-weight: 500; }
.history-item .meta {
  font-size: 11px;
  color: var(--text-mute);
  display: flex;
  gap: 10px;
}
.history-item .meta strong { color: var(--text); font-weight: 600; }
.history-item .breakdown {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 6px 12px;
  font-size: 12px;
}
.history-item .breakdown-row {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
}
.history-item .breakdown-name { color: var(--text-sub); }
.history-item .breakdown-val { font-weight: 600; color: var(--text); }
.history-item .breakdown-val .unit { font-size: 10px; color: var(--text-mute); margin-left: 1px; font-weight: 400; }
.history-item .summary { font-size: 12px; color: var(--text-sub); margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border); }

.empty {
  text-align: center;
  color: var(--text-mute);
  padding: 40px 20px;
  font-size: 14px;
}

/* ===== Chart ===== */
.chart-card {
  background: var(--card);
  border-radius: var(--radius);
  padding: 18px;
  box-shadow: var(--shadow);
  margin-bottom: 16px;
}
.chart-card h3 { font-size: 14px; font-weight: 600; margin-bottom: 12px; }
.chart-tabs { display: flex; gap: 6px; margin-bottom: 12px; flex-wrap: wrap; }
.chart-tab {
  padding: 6px 12px;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 999px;
  font-size: 11px;
  font-weight: 600;
  cursor: pointer;
  font-family: inherit;
  color: var(--text-sub);
}
.chart-tab.active { background: var(--primary); color: white; border-color: var(--primary); }
canvas { max-width: 100%; height: 200px !important; }

/* ===== Toast ===== */
.toast {
  position: fixed;
  bottom: 90px;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(26, 29, 41, 0.95);
  color: white;
  padding: 10px 18px;
  border-radius: 999px;
  font-size: 13px;
  font-weight: 500;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.2s;
  z-index: 200;
}
.toast.show { opacity: 1; }

/* ===== Editing banner ===== */
.editing-banner {
  background: #fef3c7;
  border: 1px solid #fcd34d;
  border-radius: var(--radius);
  padding: 12px 16px;
  margin-bottom: 14px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
}
.editing-banner .text {
  font-size: 13px;
  color: #92400e;
  font-weight: 600;
}
.editing-banner .text .sub {
  font-size: 11px;
  font-weight: 400;
  color: #b45309;
  margin-top: 2px;
  display: block;
}
.editing-banner button {
  background: #f59e0b;
  color: white;
  border: none;
  padding: 8px 14px;
  border-radius: 8px;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  font-family: inherit;
  white-space: nowrap;
}
.editing-banner button:active { transform: scale(0.96); }

/* ===== History item clickable ===== */
.history-item {
  cursor: pointer;
  transition: transform 0.1s, box-shadow 0.1s;
}
.history-item:active {
  transform: scale(0.99);
  box-shadow: 0 1px 2px rgba(0,0,0,0.04);
}
</style>
</head>
<body>

<div class="container">
  <div class="header">
    <div>
      <h1>筋トレ記録</h1>
      <div class="date" id="todayDate"></div>
    </div>
    <button class="header-btn" onclick="openHistory()">📅 履歴</button>
  </div>

  <div id="editingBanner" class="editing-banner" style="display:none">
    <div class="text">
      過去の記録を編集中
      <span class="sub" id="editingDate"></span>
    </div>
    <button onclick="exitEditMode()">本日に戻る</button>
  </div>

  <div class="tab-badge" id="tabBadge">本日のトレーニング</div>

  <div class="volume-card">
    <div>
      <div class="label">本日の総ボリューム</div>
      <div class="value"><span id="totalVolume">0</span><span class="unit">kg</span></div>
    </div>
    <div class="compare" id="compareLast">前回データなし</div>
  </div>

  <div id="exercises"></div>

  <div class="bottom-card">
    <h3>体調</h3>
    <div class="condition-row" id="conditionRow">
      <button class="condition-btn" data-val="1">1</button>
      <button class="condition-btn" data-val="2">2</button>
      <button class="condition-btn" data-val="3">3</button>
      <button class="condition-btn" data-val="4">4</button>
      <button class="condition-btn" data-val="5">5</button>
    </div>
    <h3>メモ</h3>
    <textarea class="memo" id="memo" placeholder="気づき・違和感・コンディションなど"></textarea>
  </div>
</div>

<div class="save-bar">
  <div class="container">
    <button class="save-btn" id="saveBtn" onclick="saveSession()">本日の記録を保存</button>
  </div>
</div>

<!-- History modal -->
<div class="modal" id="historyModal">
  <div class="modal-content">
    <div class="modal-header">
      <h2>履歴</h2>
      <button class="close-btn" onclick="closeHistory()">×</button>
    </div>

    <div class="history-actions">
      <button onclick="exportData()">エクスポート</button>
      <button onclick="document.getElementById('importInput').click()">インポート</button>
      <button class="danger" onclick="confirmClear()">全削除</button>
    </div>
    <input type="file" id="importInput" accept=".json" style="display:none" onchange="importData(event)">

    <div class="chart-card">
      <h3 id="chartTitle">本番重量の推移</h3>
      <div class="chart-tabs" id="chartTabs"></div>
      <canvas id="chart"></canvas>
    </div>

    <div id="historyList"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ========================================
// 設定: ベースメニュー
// ========================================
const EXERCISES = [
  {
    name: "スクワット",
    step: 2.5,
    sets: [
      { type: "warmup", label: "アップ", weight: 62.5, reps: 10 },
      { type: "main", label: "第1セット", weight: 82.5, reps: 8 },
      { type: "main", label: "第2セット", weight: 82.5, reps: 8 },
      { type: "main", label: "第3セット", weight: 82.5, reps: 8 },
      { type: "main", label: "第4セット", weight: 82.5, reps: 8 },
    ]
  },
  {
    name: "ベンチプレス",
    step: 2.5,
    sets: [
      { type: "warmup", label: "アップ", weight: 42.5, reps: 10 },
      { type: "main", label: "第1セット", weight: 52.5, reps: 7 },
      { type: "main", label: "第2セット", weight: 52.5, reps: 7 },
      { type: "main", label: "第3セット", weight: 52.5, reps: 7 },
      { type: "main", label: "第4セット", weight: 52.5, reps: 7 },
    ]
  },
  {
    name: "ラットプルダウン",
    step: 2.5,
    sets: [
      { type: "main", label: "第1セット", weight: 50, reps: 10 },
      { type: "main", label: "第2セット", weight: 50, reps: 10 },
      { type: "main", label: "第3セット", weight: 50, reps: 10 },
    ]
  },
  {
    name: "ショルダープレス",
    step: 2.5,
    sets: [
      { type: "main", label: "第1セット", weight: 10, reps: 12 },
      { type: "main", label: "第2セット", weight: 10, reps: 12 },
      { type: "main", label: "第3セット", weight: 10, reps: 12 },
    ]
  },
];
const GAS_URL = "https://script.google.com/macros/s/AKfycbx9cyi6wNDRalJ-UneEW7or9eUAiHo19LYEvsaregvwcBInZsj_1siM30g7oagsbAIF/exec";
const STORAGE_KEY = "workout_log_v1";
let session = null;
let stashedSession = null;  // 過去記録編集中の当日セッション退避先
let editingDate = null;      // 編集中の日付(null=当日)
let chartInstance = null;
let currentChartExercise = -1;

// ========================================
// 初期化
// ========================================
function init() {
  document.getElementById("todayDate").textContent = formatToday();
  initSession();
  render();
  setupConditionButtons();
  document.getElementById("memo").addEventListener("input", e => {
    session.memo = e.target.value;
  });
}

function formatToday() {
  const d = new Date();
  const days = ["日", "月", "火", "水", "木", "金", "土"];
  return `${d.getFullYear()}年${d.getMonth() + 1}月${d.getDate()}日(${days[d.getDay()]})`;
}

function initSession() {
  session = {
    date: new Date().toISOString().split("T")[0],
    exercises: EXERCISES.map(ex => ({
      name: ex.name,
      step: ex.step,
      sets: ex.sets.map(s => ({ ...s, completed: false }))
    })),
    condition: null,
    memo: "",
  };
}

// ========================================
// 描画
// ========================================
function render() {
  const container = document.getElementById("exercises");
  container.innerHTML = "";

  // 前回の記録を取得(種目別ボリューム比較用)
  const history = loadHistory();
  const last = history[history.length - 1];

  session.exercises.forEach((ex, exIdx) => {
    const card = document.createElement("div");
    card.className = "exercise-card";

    // 当日のこの種目のボリューム
    const exVolume = ex.sets.reduce((sum, s) => s.completed ? sum + s.weight * s.reps : sum, 0);

    // 前回の同種目ボリューム
    let prevVolume = null;
    if (last) {
      const prevEx = last.exercises.find(e => e.name === ex.name);
      if (prevEx) {
        prevVolume = prevEx.sets.reduce((sum, s) => s.completed ? sum + s.weight * s.reps : sum, 0);
      }
    }

    // 比較表示
    let compareHtml = "";
    if (prevVolume !== null && prevVolume > 0) {
      const diff = exVolume - prevVolume;
      if (exVolume === 0) {
        compareHtml = `<div class="exercise-compare">前回 ${prevVolume.toLocaleString()}kg</div>`;
      } else if (diff > 0) {
        compareHtml = `<div class="exercise-compare positive">前回比 +${diff.toLocaleString()}kg</div>`;
      } else if (diff < 0) {
        compareHtml = `<div class="exercise-compare negative">前回比 ${diff.toLocaleString()}kg</div>`;
      } else {
        compareHtml = `<div class="exercise-compare">前回比 ±0kg</div>`;
      }
    }

    let html = `
      <div class="exercise-header">
        <div>
          <div class="exercise-name">${ex.name}</div>
          <div class="step-badge" style="margin-top:6px;display:inline-block">刻み ${ex.step}kg</div>
        </div>
        <div class="exercise-header-right">
          <div class="exercise-volume ${exVolume === 0 ? 'zero' : ''}">${exVolume.toLocaleString()}<span class="unit">kg</span></div>
          ${compareHtml}
        </div>
      </div>
    `;

    ex.sets.forEach((s, setIdx) => {
      html += renderSet(exIdx, setIdx, s);
    });

    html += `<button class="add-set-btn" onclick="addSet(${exIdx})">+ セットを追加</button>`;

    card.innerHTML = html;
    container.appendChild(card);
  });

  updateVolume();
}

function renderSet(exIdx, setIdx, s) {
  const rowClass = s.completed ? "completed" : (s.type === "warmup" ? "warmup" : "");
  return `
    <div class="set-row ${rowClass}">
      <div class="set-label">${s.label}</div>
      <div class="set-controls">
        <div class="input-group">
          <span class="input-label">重量(kg)</span>
          <div class="stepper">
            <button onclick="adjust(${exIdx},${setIdx},'weight',-1)">−</button>
            <input type="number" inputmode="decimal" step="0.5" value="${s.weight}"
              onchange="setVal(${exIdx},${setIdx},'weight',this.value)">
            <button onclick="adjust(${exIdx},${setIdx},'weight',1)">+</button>
          </div>
        </div>
        <div class="input-group">
          <span class="input-label">回数(回)</span>
          <div class="stepper">
            <button onclick="adjust(${exIdx},${setIdx},'reps',-1)">−</button>
            <input type="number" inputmode="numeric" step="1" value="${s.reps}"
              onchange="setVal(${exIdx},${setIdx},'reps',this.value)">
            <button onclick="adjust(${exIdx},${setIdx},'reps',1)">+</button>
          </div>
        </div>
        <button class="complete-btn" onclick="toggleComplete(${exIdx},${setIdx})">
          ${s.completed ? "✓ 完了" : "完了"}
        </button>
      </div>
    </div>
  `;
}

// ========================================
// 操作
// ========================================
function adjust(exIdx, setIdx, key, dir) {
  const s = session.exercises[exIdx].sets[setIdx];
  const step = key === "weight" ? session.exercises[exIdx].step : 1;
  s[key] = Math.max(0, +(s[key] + dir * step).toFixed(2));
  render();
}

function setVal(exIdx, setIdx, key, val) {
  const s = session.exercises[exIdx].sets[setIdx];
  s[key] = Math.max(0, parseFloat(val) || 0);
  updateVolume();
}

function toggleComplete(exIdx, setIdx) {
  const s = session.exercises[exIdx].sets[setIdx];
  s.completed = !s.completed;
  render();
}

function addSet(exIdx) {
  const ex = session.exercises[exIdx];
  const last = ex.sets[ex.sets.length - 1];
  const mainSets = ex.sets.filter(s => s.type === "main").length;
  ex.sets.push({
    type: "main",
    label: `第${mainSets + 1}セット`,
    weight: last.weight,
    reps: last.reps,
    completed: false
  });
  render();
}

function setupConditionButtons() {
  document.querySelectorAll(".condition-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      const val = parseInt(btn.dataset.val);
      session.condition = session.condition === val ? null : val;
      document.querySelectorAll(".condition-btn").forEach(b => {
        b.classList.toggle("active", parseInt(b.dataset.val) === session.condition);
      });
    });
  });
}

// ========================================
// ボリューム計算
// ========================================
function updateVolume() {
  // 「完了」したセットのみ加算(アップ含む)
  let total = 0;
  session.exercises.forEach(ex => {
    ex.sets.forEach(s => {
      if (s.completed) total += s.weight * s.reps;
    });
  });
  document.getElementById("totalVolume").textContent = total.toLocaleString();

  // 前回比較
  const history = loadHistory();
  const last = history[history.length - 1];
  const compareEl = document.getElementById("compareLast");
  if (last && last.totalVolume) {
    const diff = total - last.totalVolume;
    if (diff > 0) {
      compareEl.textContent = `前回比 +${diff.toLocaleString()}kg`;
      compareEl.className = "compare positive";
    } else if (diff < 0) {
      compareEl.textContent = `前回比 ${diff.toLocaleString()}kg`;
      compareEl.className = "compare negative";
    } else {
      compareEl.textContent = "前回比 ±0kg";
      compareEl.className = "compare";
    }
  } else {
    compareEl.textContent = "前回データなし";
    compareEl.className = "compare";
  }
}

// ========================================
// 保存
// ========================================
function loadHistory() {
  try {
    return JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
  } catch { return []; }
}

function saveHistory(arr) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(arr));
}

function saveSession() {
  let total = 0;
  session.exercises.forEach(ex => ex.sets.forEach(s => {
    if (s.completed) total += s.weight * s.reps;
  }));
  const completedSets = session.exercises.reduce((sum, ex) =>
    sum + ex.sets.filter(s => s.completed).length, 0);

  const record = {
    ...JSON.parse(JSON.stringify(session)),
    totalVolume: total,
    completedSets,
    savedAt: new Date().toISOString()
  };

  const history = loadHistory();
  // 同じ日付の記録は上書き
  const existingIdx = history.findIndex(h => h.date === record.date);
  if (existingIdx >= 0) {
    history[existingIdx] = record;
  } else {
    history.push(record);
  }
  saveHistory(history);

  const btn = document.getElementById("saveBtn");
  btn.textContent = editingDate ? "✓ 更新しました" : "✓ 保存しました";
  btn.classList.add("saved");
  setTimeout(() => {
    btn.textContent = editingDate ? "この日の記録を更新" : "本日の記録を保存";
    btn.classList.remove("saved");
  }, 2000);
syncToSheet(record);
  showToast(editingDate ? "更新しました" : "保存しました");
}

function showToast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 1800);
}

// ========================================
// 履歴モーダル
// ========================================
function openHistory() {
  document.getElementById("historyModal").classList.add("open");
  renderHistory();
  renderChartTabs();
  renderChart();
}

function closeHistory() {
  document.getElementById("historyModal").classList.remove("open");
}

function renderHistory() {
  const history = loadHistory().slice().reverse();
  const list = document.getElementById("historyList");
  if (history.length === 0) {
    list.innerHTML = '<div class="empty">まだ記録がありません</div>';
    return;
  }
  list.innerHTML = history.map(h => {
    const d = new Date(h.date);
    const days = ["日","月","火","水","木","金","土"];
    const dateStr = `${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()}(${days[d.getDay()]})`;

    // 種目ごとの内訳
    const breakdownHtml = h.exercises.map(ex => {
      const exVol = ex.sets.reduce((sum, s) => s.completed ? sum + s.weight * s.reps : sum, 0);
      const completedSets = ex.sets.filter(s => s.completed);
      const maxW = completedSets.length > 0 ? Math.max(...completedSets.map(s => s.weight)) : 0;
      return `
        <div class="breakdown-row">
          <span class="breakdown-name">${ex.name}</span>
          <span class="breakdown-val">${exVol.toLocaleString()}<span class="unit">kg</span> ${maxW > 0 ? `<span style="color:var(--text-mute);font-weight:400;font-size:10px">(MAX ${maxW}kg)</span>` : ''}</span>
        </div>
      `;
    }).join("");

    return `
      <div class="history-item" onclick="enterEditMode('${h.date}')">
        <div class="total-row">
          <div>
            <div class="date">${dateStr}</div>
            <div class="meta">
              <span><strong>${h.completedSets||0}</strong> セット完了</span>
              ${h.condition ? `<span>体調 <strong>${h.condition}</strong></span>` : ""}
            </div>
          </div>
          <div class="total-volume">${(h.totalVolume||0).toLocaleString()}<span class="unit">kg</span></div>
        </div>
        <div class="breakdown">
          ${breakdownHtml}
        </div>
        ${h.memo ? `<div class="summary">${escapeHtml(h.memo)}</div>` : ""}
      </div>
    `;
  }).join("");
}
function syncToSheet(record) {
  fetch(GAS_URL, {
    method: "POST",
    mode: "no-cors",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(record)
  }).catch(err => console.log("Sync error:", err));
}
function escapeHtml(s) {
  return s.replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

// ========================================
// 編集モード(過去記録の閲覧・編集)
// ========================================
function enterEditMode(date) {
  const history = loadHistory();
  const record = history.find(h => h.date === date);
  if (!record) {
    showToast("記録が見つかりませんでした");
    return;
  }

  // 当日のセッションがまだ保存されてない場合、退避
  // (編集中=null で、現在のsession.dateが今日なら退避)
  const today = new Date().toISOString().split("T")[0];
  if (editingDate === null && session.date === today) {
    stashedSession = JSON.parse(JSON.stringify(session));
  }

  // 履歴の記録をsessionに展開
  session = {
    date: record.date,
    exercises: JSON.parse(JSON.stringify(record.exercises)),
    condition: record.condition || null,
    memo: record.memo || "",
  };
  editingDate = date;

  // UI更新
  closeHistory();
  updateHeaderForEditMode();
  render();
  document.getElementById("memo").value = session.memo;
  updateConditionButtons();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function exitEditMode() {
  if (stashedSession) {
    session = stashedSession;
    stashedSession = null;
  } else {
    initSession();
  }
  editingDate = null;
  updateHeaderForEditMode();
  render();
  document.getElementById("memo").value = session.memo;
  updateConditionButtons();
  showToast("本日の記録に戻りました");
}

function updateHeaderForEditMode() {
  const banner = document.getElementById("editingBanner");
  const tabBadge = document.getElementById("tabBadge");
  const saveBtn = document.getElementById("saveBtn");
  if (editingDate) {
    const d = new Date(editingDate);
    const days = ["日","月","火","水","木","金","土"];
    const dateStr = `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日(${days[d.getDay()]})`;
    document.getElementById("editingDate").textContent = dateStr;
    banner.style.display = "flex";
    tabBadge.style.display = "none";
    saveBtn.textContent = "この日の記録を更新";
    document.getElementById("todayDate").textContent = dateStr;
  } else {
    banner.style.display = "none";
    tabBadge.style.display = "inline-flex";
    saveBtn.textContent = "本日の記録を保存";
    document.getElementById("todayDate").textContent = formatToday();
  }
}

function updateConditionButtons() {
  document.querySelectorAll(".condition-btn").forEach(b => {
    b.classList.toggle("active", parseInt(b.dataset.val) === session.condition);
  });
}

// ========================================
// チャート
// ========================================
// currentChartExercise: -1 = 総ボリューム / 0+ = 種目インデックス
function renderChartTabs() {
  const tabs = document.getElementById("chartTabs");
  let html = `<button class="chart-tab ${currentChartExercise === -1 ? 'active' : ''}" onclick="switchChart(-1)">総ボリューム</button>`;
  html += EXERCISES.map((ex, i) =>
    `<button class="chart-tab ${i === currentChartExercise ? 'active' : ''}" onclick="switchChart(${i})">${ex.name}</button>`
  ).join("");
  tabs.innerHTML = html;
}

function switchChart(idx) {
  currentChartExercise = idx;
  renderChartTabs();
  renderChart();
}

function renderChart() {
  const history = loadHistory();
  let points = [];
  let title = "";

  if (currentChartExercise === -1) {
    points = history
      .map(h => h.totalVolume ? { date: h.date, weight: h.totalVolume } : null)
      .filter(Boolean);
    title = "総ボリュームの推移 (kg)";
  } else {
    const exName = EXERCISES[currentChartExercise].name;
    points = history
      .map(h => {
        const ex = h.exercises.find(e => e.name === exName);
        if (!ex) return null;
        // 完了したセットの中での最大重量
        const completedSets = ex.sets.filter(s => s.completed);
        if (completedSets.length === 0) return null;
        const maxWeight = Math.max(...completedSets.map(s => s.weight));
        return { date: h.date, weight: maxWeight };
      })
      .filter(Boolean);
    title = exName + " の最大重量 (kg)";
  }

  document.getElementById("chartTitle").textContent = title;
  drawChart(points);
}

function drawChart(points) {
  const canvas = document.getElementById("chart");
  const ctx = canvas.getContext("2d");
  const dpr = window.devicePixelRatio || 1;
  const w = canvas.offsetWidth;
  const h = 200;
  canvas.width = w * dpr;
  canvas.height = h * dpr;
  ctx.scale(dpr, dpr);
  ctx.clearRect(0, 0, w, h);

  if (points.length === 0) {
    ctx.fillStyle = "#9ca3af";
    ctx.font = "14px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText("データがありません", w / 2, h / 2);
    return;
  }

  const padding = { top: 20, right: 20, bottom: 30, left: 55 };
  const chartW = w - padding.left - padding.right;
  const chartH = h - padding.top - padding.bottom;

  const weights = points.map(p => p.weight);
  const minW = Math.min(...weights);
  const maxW = Math.max(...weights);
  const buffer = (maxW - minW) * 0.1 || (maxW * 0.05) || 2;
  const yMin = Math.max(0, minW - buffer);
  const yMax = maxW + buffer;
  const range = yMax - yMin || 1;

  // 軸
  ctx.strokeStyle = "#e5e7eb";
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(padding.left, padding.top);
  ctx.lineTo(padding.left, padding.top + chartH);
  ctx.lineTo(padding.left + chartW, padding.top + chartH);
  ctx.stroke();

  // Y軸ラベル
  ctx.fillStyle = "#9ca3af";
  ctx.font = "10px sans-serif";
  ctx.textAlign = "right";
  for (let i = 0; i <= 4; i++) {
    const v = yMin + (range * i / 4);
    const y = padding.top + chartH - (chartH * i / 4);
    const label = v >= 100 ? Math.round(v).toLocaleString() : v.toFixed(1);
    ctx.fillText(label, padding.left - 6, y + 3);
    ctx.strokeStyle = "#f3f4f6";
    ctx.beginPath();
    ctx.moveTo(padding.left, y);
    ctx.lineTo(padding.left + chartW, y);
    ctx.stroke();
  }

  // 線
  ctx.strokeStyle = "#6366f1";
  ctx.lineWidth = 2;
  ctx.beginPath();
  points.forEach((p, i) => {
    const x = padding.left + (points.length === 1 ? chartW / 2 : chartW * i / (points.length - 1));
    const y = padding.top + chartH - (chartH * (p.weight - yMin) / range);
    if (i === 0) ctx.moveTo(x, y);
    else ctx.lineTo(x, y);
  });
  ctx.stroke();

  // 点
  points.forEach((p, i) => {
    const x = padding.left + (points.length === 1 ? chartW / 2 : chartW * i / (points.length - 1));
    const y = padding.top + chartH - (chartH * (p.weight - yMin) / range);
    ctx.fillStyle = "#6366f1";
    ctx.beginPath();
    ctx.arc(x, y, 4, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "white";
    ctx.beginPath();
    ctx.arc(x, y, 2, 0, Math.PI * 2);
    ctx.fill();
  });

  // X軸ラベル(最初・中・最後)
  ctx.fillStyle = "#9ca3af";
  ctx.font = "10px sans-serif";
  ctx.textAlign = "center";
  const showIdx = points.length <= 3 ? points.map((_, i) => i) :
    [0, Math.floor(points.length / 2), points.length - 1];
  showIdx.forEach(i => {
    const x = padding.left + (points.length === 1 ? chartW / 2 : chartW * i / (points.length - 1));
    const d = new Date(points[i].date);
    ctx.fillText(`${d.getMonth() + 1}/${d.getDate()}`, x, padding.top + chartH + 16);
  });
}

// ========================================
// エクスポート/インポート
// ========================================
function exportData() {
  const data = {
    exportedAt: new Date().toISOString(),
    history: loadHistory()
  };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `workout_${new Date().toISOString().split("T")[0]}.json`;
  a.click();
  URL.revokeObjectURL(url);
  showToast("エクスポートしました");
}

function importData(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const data = JSON.parse(e.target.result);
      if (!data.history || !Array.isArray(data.history)) throw new Error("不正な形式");
      if (!confirm(`${data.history.length}件の記録をインポートします。現在のデータは上書きされます。よろしいですか?`)) return;
      saveHistory(data.history);
      renderHistory();
      renderChart();
      showToast("インポート完了");
    } catch (err) {
      alert("ファイルを読み込めませんでした: " + err.message);
    }
  };
  reader.readAsText(file);
  event.target.value = "";
}

function confirmClear() {
  if (!confirm("すべての記録を削除します。本当によろしいですか?\n(エクスポートしてバックアップを取ることをおすすめします)")) return;
  if (!confirm("最終確認: すべての記録が削除されます。実行しますか?")) return;
  localStorage.removeItem(STORAGE_KEY);
  renderHistory();
  renderChart();
  showToast("削除しました");
}

// ========================================
// 起動
// ========================================
if (document.readyState === "loading") {
  document.addEventListener("DOMContentLoaded", init);
} else {
  init();
}
</script>

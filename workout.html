<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>筋トレ記録</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    input[type=number]::-webkit-inner-spin-button,
    input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
    input[type=number] { -moz-appearance: textfield; }
  </style>
</head>
<body class="bg-slate-100 min-h-screen font-sans">

  <!-- Main content -->
  <div class="max-w-md mx-auto px-4 pt-4 pb-32" id="app"></div>

  <!-- Fixed bottom save button -->
  <div class="fixed bottom-0 left-0 right-0 px-4 pb-6 pt-3 bg-gradient-to-t from-slate-100 via-slate-100/90 to-transparent pointer-events-none">
    <button onclick="finishWorkout()"
      class="pointer-events-auto w-full max-w-md mx-auto block bg-indigo-600 active:bg-indigo-800 text-white font-bold py-4 rounded-2xl text-base shadow-xl shadow-indigo-200 transition-all active:scale-95">
      トレーニング終了（保存）
    </button>
  </div>

  <!-- ── Calendar Modal ── -->
  <div id="calendar-modal" class="hidden fixed inset-0 bg-black/60 backdrop-blur-sm z-40 flex items-end justify-center p-4 sm:items-center">
    <div class="bg-white rounded-3xl w-full max-w-sm shadow-2xl overflow-hidden">
      <div class="px-5 pt-5 pb-4">
        <!-- Modal header -->
        <div class="flex items-center justify-between mb-5">
          <h2 class="text-lg font-bold text-gray-800">トレーニング履歴</h2>
          <button onclick="closeCalendarModal()"
            class="w-9 h-9 flex items-center justify-center rounded-full bg-gray-100 text-gray-500 text-xl active:bg-gray-200">×</button>
        </div>
        <!-- Month navigation -->
        <div class="flex items-center justify-between mb-4">
          <button onclick="prevMonth()"
            class="w-11 h-11 flex items-center justify-center rounded-xl bg-gray-100 active:bg-gray-200 text-gray-600 text-2xl font-bold">‹</button>
          <span id="cal-title" class="font-bold text-gray-800 text-base"></span>
          <button onclick="nextMonth()"
            class="w-11 h-11 flex items-center justify-center rounded-xl bg-gray-100 active:bg-gray-200 text-gray-600 text-2xl font-bold">›</button>
        </div>
        <!-- Weekday headers -->
        <div class="grid grid-cols-7 mb-1">
          <div class="text-center text-xs font-semibold py-1 text-red-400">日</div>
          <div class="text-center text-xs font-semibold py-1 text-gray-400">月</div>
          <div class="text-center text-xs font-semibold py-1 text-gray-400">火</div>
          <div class="text-center text-xs font-semibold py-1 text-gray-400">水</div>
          <div class="text-center text-xs font-semibold py-1 text-gray-400">木</div>
          <div class="text-center text-xs font-semibold py-1 text-gray-400">金</div>
          <div class="text-center text-xs font-semibold py-1 text-blue-400">土</div>
        </div>
        <!-- Day grid -->
        <div id="cal-grid" class="grid grid-cols-7 gap-1"></div>
      </div>
      <!-- Legend -->
      <div class="flex items-center gap-4 px-5 py-3 border-t border-gray-100 bg-gray-50">
        <div class="flex items-center gap-1.5">
          <div class="w-3 h-3 rounded-full bg-indigo-600"></div>
          <span class="text-xs text-gray-500">今日</span>
        </div>
        <div class="flex items-center gap-1.5">
          <div class="w-3 h-3 rounded-full bg-indigo-200"></div>
          <span class="text-xs text-gray-500">記録あり（タップで詳細）</span>
        </div>
      </div>
    </div>
  </div>

  <!-- ── Day Detail Modal ── -->
  <div id="day-detail-modal" class="hidden fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-end justify-center p-4 sm:items-center">
    <div class="bg-white rounded-3xl p-6 w-full max-w-sm shadow-2xl" style="max-height:85vh;overflow-y:auto">
      <div class="flex items-start justify-between mb-4">
        <div>
          <div id="detail-badge"
            class="text-xs font-semibold text-amber-600 bg-amber-50 border border-amber-100 px-2.5 py-1 rounded-full inline-block mb-2">
            過去の記録（閲覧中）
          </div>
          <h2 id="detail-date" class="text-lg font-bold text-gray-800"></h2>
        </div>
        <button onclick="closeDayDetailModal()"
          class="w-9 h-9 shrink-0 flex items-center justify-center rounded-full bg-gray-100 text-gray-500 text-xl active:bg-gray-200 mt-1">×</button>
      </div>
      <div id="detail-content"></div>
      <div id="detail-copy-btn"></div>
      <button onclick="closeDayDetailModal()"
        class="mt-3 w-full bg-gray-100 active:bg-gray-200 text-gray-600 font-semibold py-3 rounded-xl transition-colors">
        閉じる
      </button>
    </div>
  </div>

  <!-- ── Result Modal ── -->
  <div id="result-modal" class="hidden fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-end justify-center p-4 sm:items-center">
    <div class="bg-white rounded-3xl p-6 w-full max-w-sm shadow-2xl">
      <div class="text-center mb-5">
        <div class="text-5xl mb-2">💪</div>
        <h2 class="text-xl font-bold text-gray-800">お疲れ様でした！</h2>
        <p class="text-sm text-gray-400 mt-1">1RM 更新状況</p>
      </div>
      <div id="result-content" class="divide-y divide-gray-100"></div>
      <button onclick="closeResultModal()"
        class="mt-5 w-full bg-gray-100 active:bg-gray-200 text-gray-700 font-semibold py-3 rounded-xl transition-colors">
        閉じる
      </button>
    </div>
  </div>

  <!-- ── Add Exercise Modal ── -->
  <div id="add-modal" class="hidden fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-end justify-center p-4 sm:items-center">
    <div class="bg-white rounded-3xl p-6 w-full max-w-sm shadow-2xl">
      <h2 class="text-lg font-bold text-gray-800 mb-4">種目を追加</h2>
      <input type="text" id="new-exercise-input" placeholder="例：デッドリフト"
        class="w-full border border-gray-200 rounded-xl px-4 py-3 text-base focus:outline-none focus:border-indigo-400 focus:ring-2 focus:ring-indigo-100 transition-all"
        onkeydown="if(event.key==='Enter')confirmAddExercise()">
      <div class="flex gap-3 mt-4">
        <button onclick="closeAddModal()"
          class="flex-1 bg-gray-100 active:bg-gray-200 text-gray-600 font-semibold py-3 rounded-xl">キャンセル</button>
        <button onclick="confirmAddExercise()"
          class="flex-1 bg-indigo-600 active:bg-indigo-700 text-white font-semibold py-3 rounded-xl">追加</button>
      </div>
    </div>
  </div>

  <script>
    // ── Constants ──────────────────────────────────────────────────────────────
    const TODAY = new Date().toISOString().slice(0, 10); // "2026-04-25"
    const DEFAULT_EXERCISES = ['スクワット', 'ベンチプレス', 'ラットプルダウン', 'ショルダープレス'];
    const DEFAULT_SETS = 3;

    const EXERCISE_DEFAULTS = {
      'スクワット': {
        hasWarmup: true,
        sets: [
          { weight: 62.5, reps: 10 }, // アップ
          { weight: 82.5, reps: 10 },
          { weight: 82.5, reps: 10 },
          { weight: 82.5, reps: 10 },
          { weight: 82.5, reps: 10 }, // 第4セット
        ],
      },
      'ベンチプレス': {
        hasWarmup: true,
        sets: [
          { weight: 42.5, reps: 10 }, // アップ
          { weight: 52.5, reps: 10 },
          { weight: 52.5, reps: 10 },
          { weight: 52.5, reps: 10 },
          { weight: 52.5, reps: 10 }, // 第4セット
        ],
      },
      'ラットプルダウン': {
        hasWarmup: false,
        sets: [
          { weight: 50, reps: 10 },
          { weight: 50, reps: 10 },
          { weight: 50, reps: 10 },
        ],
      },
      'ショルダープレス': {
        hasWarmup: false,
        sets: [
          { weight: 10, reps: 10 },
          { weight: 10, reps: 10 },
          { weight: 10, reps: 10 },
        ],
      },
    };

    // ── State ──────────────────────────────────────────────────────────────────
    let state = { exercises: [] };
    let workoutHistory = []; // [{ date, exercises }] sorted desc
    let prevBest1RM = {};    // best 1RM from all past records (for comparison at save)

    // Calendar navigation state
    let calYear  = new Date().getFullYear();
    let calMonth = new Date().getMonth();

    // ── Storage ────────────────────────────────────────────────────────────────
    function loadHistory() {
      try {
        const h = JSON.parse(localStorage.getItem('workoutHistory'));
        if (h && Array.isArray(h) && h.length) return h;
        // Migrate from old lastWorkoutData format
        const old = JSON.parse(localStorage.getItem('lastWorkoutData'));
        if (old && old.exercises) {
          const date = (old.date || '').slice(0, 10) || '2020-01-01';
          return [{ date, exercises: old.exercises }];
        }
        return [];
      } catch { return []; }
    }

    function saveHistoryToStorage() {
      localStorage.setItem('workoutHistory', JSON.stringify(workoutHistory));
    }

    function loadCustomExercises() {
      try { return JSON.parse(localStorage.getItem('customExercises')) || []; }
      catch { return []; }
    }

    function getRecordForDate(date) {
      return workoutHistory.find(r => r.date === date) || null;
    }

    function getLatestPastRecord() {
      const past = workoutHistory.filter(r => r.date < TODAY);
      if (!past.length) return null;
      return past.reduce((a, b) => a.date > b.date ? a : b);
    }

    // ── 1RM (Epley) ────────────────────────────────────────────────────────────
    function calc1RM(weight, reps) {
      if (!weight || weight <= 0 || !reps || reps <= 0) return 0;
      if (reps === 1) return weight;
      return Math.round(weight * (1 + reps / 30) * 10) / 10;
    }

    function getBest1RM(sets) {
      return (sets || []).reduce((max, s) => {
        const rm = calc1RM(s.weight, s.reps);
        return rm > max ? rm : max;
      }, 0);
    }

    // ── Init ───────────────────────────────────────────────────────────────────
    function initState() {
      workoutHistory = loadHistory();

      // Build prevBest1RM from all past records (excluding today)
      workoutHistory.filter(r => r.date < TODAY).forEach(record => {
        (record.exercises || []).forEach(ex => {
          const rm = ex.best1rm ?? getBest1RM(ex.sets || []);
          if (rm > (prevBest1RM[ex.name] || 0)) prevBest1RM[ex.name] = rm;
        });
      });

      // Source: today's existing record → latest past record → empty (use EXERCISE_DEFAULTS)
      const source = getRecordForDate(TODAY) || getLatestPastRecord();
      buildExerciseState(source?.exercises || []);
    }

    function buildExerciseState(sourceExercises) {
      const srcMap = {};
      (sourceExercises || []).forEach(ex => { srcMap[ex.name] = ex; });

      const seen  = new Set(DEFAULT_EXERCISES);
      const names = [...DEFAULT_EXERCISES];
      loadCustomExercises().forEach(n => { if (!seen.has(n)) { seen.add(n); names.push(n); } });
      workoutHistory.forEach(r => {
        (r.exercises || []).forEach(ex => { if (!seen.has(ex.name)) { seen.add(ex.name); names.push(ex.name); } });
      });

      state.exercises = names.map(name => {
        const srcEx     = srcMap[name];
        const defaults  = EXERCISE_DEFAULTS[name];
        const step      = srcEx?.step ?? 2.5;
        const hasWarmup = defaults?.hasWarmup ?? false;
        const srcSets   = srcEx?.sets || [];
        const defSets   = defaults?.sets ?? Array.from({ length: DEFAULT_SETS }, () => ({ weight: 0, reps: 0 }));
        const numSets   = Math.max(defSets.length, srcSets.length);
        const sets      = Array.from({ length: numSets }, (_, i) => ({
          weight: srcSets[i]?.weight ?? defSets[i]?.weight ?? 0,
          reps:   srcSets[i]?.reps   ?? defSets[i]?.reps   ?? 0,
          done:   false,
        }));
        return { name, step, hasWarmup, sets };
      });
    }

    // ── DOM → State sync ───────────────────────────────────────────────────────
    function syncFromDOM() {
      document.querySelectorAll('input[data-ei]').forEach(inp => {
        const ei = +inp.dataset.ei, si = +inp.dataset.si, field = inp.dataset.field;
        if (state.exercises[ei]?.sets[si]) {
          state.exercises[ei].sets[si][field] = parseFloat(inp.value) || 0;
        }
      });
    }

    // ── Total volume (weight × reps) ───────────────────────────────────────────
    function getTotalVolume(exercises) {
      return Math.round(
        (exercises || []).reduce((total, ex) =>
          total + (ex.sets || []).reduce((s, set) => s + (set.weight || 0) * (set.reps || 0), 0), 0)
        * 10) / 10;
    }

    // ── Set label ──────────────────────────────────────────────────────────────
    function getSetLabel(exercise, si) {
      if (exercise.hasWarmup) return si === 0 ? 'アップ' : `第${si}セット`;
      return `第${si + 1}セット`;
    }

    // ── Main render ────────────────────────────────────────────────────────────
    function render() {
      const todayFormatted = new Date(TODAY + 'T00:00:00').toLocaleDateString('ja-JP', {
        year: 'numeric', month: 'long', day: 'numeric', weekday: 'short',
      });
      const hasTodayRecord = !!getRecordForDate(TODAY);

      document.getElementById('app').innerHTML = `
        <!-- Header -->
        <div class="flex items-start justify-between mb-3">
          <div>
            <h1 class="text-2xl font-bold text-gray-800">筋トレ記録</h1>
            <p class="text-sm text-gray-400 mt-0.5">${todayFormatted}</p>
          </div>
          <button onclick="openCalendarModal()"
            class="flex items-center gap-1.5 px-3.5 py-2.5 bg-white border border-gray-200 rounded-2xl text-sm font-semibold text-gray-600 shadow-sm active:bg-gray-50 transition-colors mt-1">
            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <rect x="3" y="4" width="18" height="18" rx="2" fill="none"/>
              <line x1="16" y1="2" x2="16" y2="6"/>
              <line x1="8" y1="2" x2="8" y2="6"/>
              <line x1="3" y1="10" x2="21" y2="10"/>
            </svg>
            履歴
          </button>
        </div>

        <!-- Status badge -->
        <div class="mb-4">
          <div class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-full border
            ${hasTodayRecord
              ? 'bg-emerald-50 border-emerald-100 text-emerald-700'
              : 'bg-indigo-50 border-indigo-100 text-indigo-700'}">
            <div class="w-2 h-2 rounded-full ${hasTodayRecord ? 'bg-emerald-500' : 'bg-indigo-500 animate-pulse'}"></div>
            <span class="text-xs font-semibold">
              ${hasTodayRecord ? '本日のトレーニング（保存済）' : '本日のトレーニング'}
            </span>
          </div>
        </div>

        <!-- Total reps widget -->
        ${(() => {
          const currVol = getTotalVolume(state.exercises);
          const prevVol = getTotalVolume(getLatestPastRecord()?.exercises);
          const diff    = Math.round((currVol - prevVol) * 10) / 10;
          const hasPrev = prevVol > 0;
          const diffLabel = !hasPrev ? ''
            : diff > 0 ? `<span class="text-emerald-600 font-bold text-sm">+${diff}kg 🚀</span>`
            : diff < 0 ? `<span class="text-red-400 font-bold text-sm">${diff}kg 📉</span>`
            : `<span class="text-gray-400 font-semibold text-sm">±0kg</span>`;
          return `
            <div class="bg-white rounded-2xl shadow-sm border border-gray-100 px-4 py-3 mb-5 flex items-center justify-between">
              <div>
                <div class="text-xs text-gray-400 mb-0.5">本日の総ボリューム</div>
                <div class="text-3xl font-bold text-gray-800 leading-none">${currVol.toLocaleString()}<span class="text-base font-semibold text-gray-400 ml-1">kg</span></div>
              </div>
              <div class="text-right">
                ${hasPrev ? `<div class="text-xs text-gray-400 mb-1">前回比</div>${diffLabel}` : `<span class="text-xs text-gray-300">前回データなし</span>`}
              </div>
            </div>`;
        })()}

        ${state.exercises.map(renderCard).join('')}

        <button onclick="openAddModal()"
          class="w-full mt-2 border-2 border-dashed border-gray-300 text-gray-400 rounded-2xl py-4 text-sm font-medium
                 hover:border-indigo-300 hover:text-indigo-400 active:scale-95 transition-all">
          ＋ 種目を追加
        </button>
      `;
    }

    function renderCard(ex, ei) {
      const stepColor = ex.step === 2.5
        ? 'bg-indigo-50 text-indigo-600 border-indigo-100'
        : 'bg-amber-50 text-amber-600 border-amber-100';

      return `
        <div class="bg-white rounded-2xl shadow-sm border border-gray-100 mb-4 overflow-hidden">
          <div class="flex items-center justify-between px-4 py-3 border-b border-gray-100">
            <span class="font-bold text-gray-800">${ex.name}</span>
            <button onclick="toggleStep(${ei})"
              class="flex items-center gap-1 px-3 py-1.5 rounded-full border text-xs font-semibold transition-colors ${stepColor}">
              刻み ${ex.step}kg
            </button>
          </div>
          <div>${ex.sets.map((set, si) => renderSetRow(ex, set, ei, si)).join('')}</div>
          <div class="px-4 py-2.5 border-t border-gray-50">
            <button onclick="addSet(${ei})"
              class="text-sm font-medium text-indigo-500 hover:text-indigo-700 active:opacity-60 transition-colors">
              ＋ セットを追加
            </button>
          </div>
        </div>
      `;
    }

    function renderSetRow(ex, set, ei, si) {
      const doneBtn = set.done
        ? `<button onclick="toggleDone(${ei},${si})"
             class="shrink-0 flex items-center gap-1 px-3 py-2 bg-emerald-500 active:bg-emerald-600 text-white rounded-xl text-sm font-semibold shadow-sm shadow-emerald-100">
             ✓ 完了
           </button>`
        : `<button onclick="toggleDone(${ei},${si})"
             class="shrink-0 px-4 py-2 bg-gray-100 active:bg-gray-200 text-gray-400 rounded-xl text-sm font-semibold">
             完了
           </button>`;

      return `
        <div class="px-4 py-3 ${set.done ? 'bg-emerald-50' : ''} border-b border-gray-50 last:border-0 transition-colors">
          <div class="text-xs font-semibold text-gray-400 tracking-wide mb-2">${getSetLabel(ex, si)}</div>
          <div class="flex items-center gap-2">
            ${renderAdjuster(ei, si, 'weight', set.weight, '重量', 'kg', ex.step)}
            ${renderAdjuster(ei, si, 'reps',   set.reps,   '回数', '回', 1)}
            <div class="mt-4 shrink-0">${doneBtn}</div>
          </div>
        </div>
      `;
    }

    function renderAdjuster(ei, si, field, value, label, unit, step) {
      return `
        <div class="flex-1">
          <div class="text-xs text-gray-400 text-center mb-1">${label}(${unit})</div>
          <div class="flex items-center gap-1">
            <button onclick="adjust(${ei},${si},'${field}',-1)"
              class="shrink-0 w-8 h-8 bg-gray-100 active:bg-gray-300 rounded-lg flex items-center justify-center text-base font-bold text-gray-500 select-none">−</button>
            <input type="number"
              data-ei="${ei}" data-si="${si}" data-field="${field}"
              value="${value}" step="${step}" min="0"
              class="flex-1 min-w-0 w-0 text-center text-xl font-bold border border-gray-200 rounded-lg h-11
                     focus:outline-none focus:border-indigo-400 focus:ring-2 focus:ring-indigo-100 transition-colors">
            <button onclick="adjust(${ei},${si},'${field}',1)"
              class="shrink-0 w-8 h-8 bg-gray-100 active:bg-gray-300 rounded-lg flex items-center justify-center text-base font-bold text-gray-500 select-none">＋</button>
          </div>
        </div>
      `;
    }

    // ── Exercise event handlers ────────────────────────────────────────────────
    function toggleStep(ei) {
      syncFromDOM();
      state.exercises[ei].step = state.exercises[ei].step === 2.5 ? 0.5 : 2.5;
      render();
    }

    function adjust(ei, si, field, dir) {
      syncFromDOM();
      const step = field === 'weight' ? state.exercises[ei].step : 1;
      const cur  = state.exercises[ei].sets[si][field];
      state.exercises[ei].sets[si][field] = Math.max(0, Math.round((cur + dir * step) * 100) / 100);
      render();
    }

    function toggleDone(ei, si) {
      syncFromDOM();
      state.exercises[ei].sets[si].done = !state.exercises[ei].sets[si].done;
      render();
    }

    function addSet(ei) {
      syncFromDOM();
      const sets = state.exercises[ei].sets;
      const last = sets[sets.length - 1] || { weight: 0, reps: 0 };
      sets.push({ weight: last.weight, reps: last.reps, done: false });
      render();
    }

    // ── Calendar ───────────────────────────────────────────────────────────────
    function openCalendarModal() {
      calYear  = new Date().getFullYear();
      calMonth = new Date().getMonth();
      renderCalendarGrid();
      document.getElementById('calendar-modal').classList.remove('hidden');
    }

    function closeCalendarModal() {
      document.getElementById('calendar-modal').classList.add('hidden');
    }

    function prevMonth() {
      calMonth--;
      if (calMonth < 0) { calMonth = 11; calYear--; }
      renderCalendarGrid();
    }

    function nextMonth() {
      calMonth++;
      if (calMonth > 11) { calMonth = 0; calYear++; }
      renderCalendarGrid();
    }

    function renderCalendarGrid() {
      document.getElementById('cal-title').textContent = `${calYear}年 ${calMonth + 1}月`;

      const firstDow  = new Date(calYear, calMonth, 1).getDay();
      const totalDays = new Date(calYear, calMonth + 1, 0).getDate();
      const recDates  = new Set(workoutHistory.map(r => r.date));

      let html = '';
      for (let i = 0; i < firstDow; i++) html += '<div></div>';

      for (let d = 1; d <= totalDays; d++) {
        const ds  = `${calYear}-${String(calMonth + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
        const dow = new Date(ds + 'T00:00:00').getDay();
        const isToday  = ds === TODAY;
        const hasRec   = recDates.has(ds);
        const isFuture = ds > TODAY;

        let cls = 'flex flex-col items-center justify-center h-12 rounded-xl text-sm font-semibold transition-colors w-full ';
        if (isToday)       cls += 'bg-indigo-600 text-white shadow-md shadow-indigo-200';
        else if (hasRec)   cls += 'bg-indigo-100 text-indigo-700 active:bg-indigo-200';
        else if (isFuture) cls += 'text-gray-200 cursor-default';
        else if (dow === 0) cls += 'text-red-300 cursor-default';
        else if (dow === 6) cls += 'text-blue-300 cursor-default';
        else               cls += 'text-gray-300 cursor-default';

        const tappable = (hasRec || isToday) && !isFuture;
        html += `
          <button ${tappable ? `onclick="openDayDetail('${ds}')"` : 'disabled'}
            class="${cls}">
            <span>${d}</span>
            <span class="w-1.5 h-1.5 rounded-full mt-0.5 ${hasRec ? (isToday ? 'bg-white/60' : 'bg-indigo-400') : ''}"></span>
          </button>`;
      }

      document.getElementById('cal-grid').innerHTML = html;
    }

    // ── Day detail ─────────────────────────────────────────────────────────────
    function openDayDetail(dateStr) {
      const record = getRecordForDate(dateStr);
      if (!record) return;

      const isToday   = dateStr === TODAY;
      const dateLabel = new Date(dateStr + 'T00:00:00').toLocaleDateString('ja-JP', {
        year: 'numeric', month: 'long', day: 'numeric', weekday: 'short',
      });

      // Badge
      const badge = document.getElementById('detail-badge');
      badge.textContent = isToday ? '本日のトレーニング（保存済）' : '過去の記録（閲覧中）';
      badge.className = `text-xs font-semibold px-2.5 py-1 rounded-full inline-block mb-2 border ${
        isToday
          ? 'text-indigo-700 bg-indigo-50 border-indigo-100'
          : 'text-amber-600 bg-amber-50 border-amber-100'
      }`;

      document.getElementById('detail-date').textContent = dateLabel;

      // Exercise rows
      const rows = (record.exercises || []).map(ex => {
        const hasWarmup = ex.hasWarmup ?? EXERCISE_DEFAULTS[ex.name]?.hasWarmup ?? false;
        const sets = (ex.sets || []).map((s, i) => {
          const lbl = hasWarmup ? (i === 0 ? 'アップ' : `第${i}セット`) : `第${i + 1}セット`;
          return `<div class="flex justify-between text-sm py-1.5">
            <span class="text-gray-400">${lbl}</span>
            <span class="font-semibold text-gray-700">${s.weight}kg × ${s.reps}回</span>
          </div>`;
        }).join('');
        const rm = ex.best1rm ?? getBest1RM(ex.sets || []);
        return `
          <div class="mb-4 last:mb-0">
            <div class="flex justify-between items-center mb-1.5">
              <span class="font-bold text-gray-800 text-sm">${ex.name}</span>
              ${rm > 0 ? `<span class="text-xs text-indigo-600 font-bold bg-indigo-50 px-2 py-0.5 rounded-full">1RM ${rm}kg</span>` : ''}
            </div>
            <div class="bg-gray-50 rounded-xl px-3 divide-y divide-gray-100">${sets}</div>
          </div>`;
      }).join('');

      const vol = record.totalVolume ?? getTotalVolume(record.exercises);
      const volBar = vol > 0 ? `
        <div class="bg-indigo-50 border border-indigo-100 rounded-xl px-4 py-3 mb-4 flex justify-between items-center">
          <span class="text-xs font-semibold text-indigo-500">総ボリューム</span>
          <span class="text-xl font-bold text-indigo-800">${vol.toLocaleString()}<span class="text-sm font-semibold ml-1">kg</span></span>
        </div>` : '';

      document.getElementById('detail-content').innerHTML = volBar + (rows || '<p class="text-sm text-gray-400 text-center py-4">記録なし</p>');

      document.getElementById('detail-copy-btn').innerHTML = `
        ${!isToday ? `
        <button onclick="copyToToday('${dateStr}')"
          class="w-full mt-4 bg-indigo-600 active:bg-indigo-700 text-white font-bold py-3.5 rounded-xl shadow-sm shadow-indigo-200 transition-colors">
          この設定を今日の入力にコピー
        </button>` : ''}
        <button onclick="promptDeleteRecord('${dateStr}')"
          class="w-full mt-3 border border-red-200 text-red-400 active:bg-red-50 font-semibold py-3 rounded-xl text-sm transition-colors">
          この記録を削除
        </button>`;

      document.getElementById('day-detail-modal').classList.remove('hidden');
    }

    function closeDayDetailModal() {
      document.getElementById('day-detail-modal').classList.add('hidden');
    }

    function copyToToday(dateStr) {
      const record = getRecordForDate(dateStr);
      if (!record) return;
      buildExerciseState(record.exercises);
      closeDayDetailModal();
      closeCalendarModal();
      render();
    }

    function promptDeleteRecord(dateStr) {
      document.getElementById('detail-copy-btn').innerHTML = `
        <div class="mt-3 bg-red-50 border border-red-100 rounded-2xl p-4">
          <p class="text-sm font-semibold text-red-600 text-center mb-3">この記録を削除しますか？<br><span class="font-normal text-red-400">この操作は元に戻せません</span></p>
          <div class="flex gap-3">
            <button onclick="openDayDetail('${dateStr}')"
              class="flex-1 bg-gray-100 active:bg-gray-200 text-gray-600 font-semibold py-3 rounded-xl text-sm">
              キャンセル
            </button>
            <button onclick="confirmDeleteRecord('${dateStr}')"
              class="flex-1 bg-red-500 active:bg-red-600 text-white font-semibold py-3 rounded-xl text-sm shadow-sm shadow-red-200">
              削除する
            </button>
          </div>
        </div>`;
    }

    function confirmDeleteRecord(dateStr) {
      workoutHistory = workoutHistory.filter(r => r.date !== dateStr);
      saveHistoryToStorage();
      if (dateStr === TODAY) {
        const source = getLatestPastRecord();
        buildExerciseState(source?.exercises || []);
      }
      closeDayDetailModal();
      renderCalendarGrid();
      render();
    }

    // ── Add exercise modal ─────────────────────────────────────────────────────
    function openAddModal() {
      document.getElementById('add-modal').classList.remove('hidden');
      setTimeout(() => document.getElementById('new-exercise-input').focus(), 80);
    }

    function closeAddModal() {
      document.getElementById('add-modal').classList.add('hidden');
      document.getElementById('new-exercise-input').value = '';
    }

    function confirmAddExercise() {
      const inp  = document.getElementById('new-exercise-input');
      const name = inp.value.trim();
      if (!name) return;
      if (state.exercises.some(ex => ex.name === name)) {
        alert('その種目はすでに追加されています'); return;
      }
      const customs = loadCustomExercises();
      if (!customs.includes(name)) {
        customs.push(name);
        localStorage.setItem('customExercises', JSON.stringify(customs));
      }
      syncFromDOM();
      state.exercises.push({
        name, step: 2.5, hasWarmup: false,
        sets: Array.from({ length: DEFAULT_SETS }, () => ({ weight: 0, reps: 0, done: false })),
      });
      closeAddModal();
      render();
    }

    // ── Save / Finish ──────────────────────────────────────────────────────────
    function finishWorkout() {
      syncFromDOM();

      const record = {
        date:        TODAY,
        totalVolume: getTotalVolume(state.exercises),
        exercises:   state.exercises.map(ex => ({
          name:      ex.name,
          step:      ex.step,
          hasWarmup: ex.hasWarmup,
          sets:      ex.sets.map(s => ({ weight: s.weight, reps: s.reps })),
          best1rm:   getBest1RM(ex.sets),
        })),
      };

      // Upsert today's record
      const idx = workoutHistory.findIndex(r => r.date === TODAY);
      if (idx >= 0) workoutHistory[idx] = record;
      else workoutHistory.unshift(record);
      workoutHistory.sort((a, b) => b.date.localeCompare(a.date));
      saveHistoryToStorage();

      // Build result rows
      const rows = state.exercises.map(ex => {
        const curr = getBest1RM(ex.sets);
        const prev = prevBest1RM[ex.name] ?? 0;
        const diff = Math.round((curr - prev) * 10) / 10;

        let badge;
        if (curr === 0)    badge = `<span class="text-xs text-gray-400 bg-gray-100 px-2 py-0.5 rounded-full">記録なし</span>`;
        else if (prev === 0) badge = `<span class="text-xs text-blue-600 bg-blue-50 px-2 py-0.5 rounded-full">初回記録</span>`;
        else if (diff > 0) badge = `<span class="text-xs text-emerald-700 bg-emerald-50 px-2 py-0.5 rounded-full">↑ +${diff}kg UP!</span>`;
        else if (diff < 0) badge = `<span class="text-xs text-red-500 bg-red-50 px-2 py-0.5 rounded-full">↓ ${diff}kg</span>`;
        else               badge = `<span class="text-xs text-gray-500 bg-gray-100 px-2 py-0.5 rounded-full">→ キープ</span>`;

        return `
          <div class="flex justify-between items-center py-3">
            <span class="font-medium text-gray-700 text-sm">${ex.name}</span>
            <div class="flex items-center gap-2 flex-wrap justify-end">
              ${curr > 0 ? `<span class="text-sm font-bold text-gray-800">1RM ${curr}kg</span>` : ''}
              ${badge}
            </div>
          </div>`;
      }).join('');

      const currTotal = getTotalVolume(state.exercises);
      const prevTotal = getTotalVolume(getLatestPastRecord()?.exercises);
      const volDiff   = Math.round((currTotal - prevTotal) * 10) / 10;
      const volDiffLabel = prevTotal === 0
        ? `<span class="text-xs text-blue-600 bg-blue-50 px-2 py-0.5 rounded-full">初回記録</span>`
        : volDiff > 0
          ? `<span class="text-xs text-emerald-700 bg-emerald-50 px-2 py-0.5 rounded-full">+${volDiff}kg 🚀</span>`
          : volDiff < 0
            ? `<span class="text-xs text-red-500 bg-red-50 px-2 py-0.5 rounded-full">${volDiff}kg 📉</span>`
            : `<span class="text-xs text-gray-500 bg-gray-100 px-2 py-0.5 rounded-full">±0kg</span>`;

      const repsRow = `
        <div class="flex justify-between items-center py-3 mb-1 bg-indigo-50 rounded-xl px-3 -mx-1">
          <span class="font-bold text-indigo-800 text-sm">総ボリューム</span>
          <div class="flex items-center gap-2">
            <span class="text-base font-bold text-indigo-800">${currTotal.toLocaleString()}kg</span>
            ${volDiffLabel}
          </div>
        </div>`;

      document.getElementById('result-content').innerHTML = repsRow + rows;
      document.getElementById('result-modal').classList.remove('hidden');

      // Update prevBest1RM so re-saves in same session compare correctly
      state.exercises.forEach(ex => {
        const rm = getBest1RM(ex.sets);
        if (rm > (prevBest1RM[ex.name] || 0)) prevBest1RM[ex.name] = rm;
      });

      render(); // update "保存済" badge behind the modal
    }

    function closeResultModal() {
      document.getElementById('result-modal').classList.add('hidden');
    }

    // ── Boot ───────────────────────────────────────────────────────────────────
    initState();
    render();
  </script>
</body>
</html>
